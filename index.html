<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Library</title>
    <style>
        body { background-color: #141414; color: white; font-family: Arial, sans-serif; text-align: center; }
        .movie-container { margin: 50px auto; max-width: 900px; }
        video { width: 100%; border: 2px solid #333; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #E50914; } /* Netflix Red */
    </style>
</head>
<body>

    <h1>Private Movie Collection</h1>

    <div class="movie-container">
        <h2>Movie Title 1</h2>
        <video controls poster="thumbnail.jpg">
            <source src="https://your-storage-link.com/movie1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <p>A short description of the movie goes here.</p>
    </div>

</body>
</html>
